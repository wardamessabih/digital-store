<!DOCTYPE html>
<html>
<head>
    <title>Test Cart</title>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
    <div class="container py-5">
        <h1>Test Cart</h1>
        <button onclick="testAddToCart(2)" class="btn btn-primary">
            Add Product ID 2 to Cart
        </button>
        <button onclick="testCheckCart()" class="btn btn-secondary">
            Check Cart
        </button>
        <div id="result" class="mt-4"></div>
    </div>

    <script>
        function testAddToCart(productId) {
            const formData = new FormData();
            formData.append('product_id', productId);
            formData.append('quantity', 1);

            fetch('/direct-cart.php', {
                method: 'POST',
                body: formData
            })
            .then(res => res.json())
            .then(data => {
                document.getElementById('result').innerHTML = '<pre>' + JSON.stringify(data, null, 2) + '</pre>';
            })
            .catch(err => {
                document.getElementById('result').innerHTML = '<div class="text-danger">Error: ' + err.message + '</div>';
            });
        }

        function testCheckCart() {
            fetch('/direct-cart.php?action=count')
            .then(res => res.json())
            .then(data => {
                document.getElementById('result').innerHTML = '<pre>' + JSON.stringify(data, null, 2) + '</pre>';
            });
        }
    </script>
</body>
</html>
